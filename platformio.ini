[platformio]
default_envs = devkitc1-n4
src_dir = .

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
lib_deps = adafruit/Adafruit NeoPixel

[env:devkitc1-n4]
board = esp32-c5-devkitc1-n4
; we need this to be able to use the USB-UART port
monitor_dtr = 0
monitor_rts = 0

; enable these flags to use the USB-native port
; build_flags =
; 	-D ARDUINO_USB_MODE=1
; 	-D ARDUINO_USB_CDC_ON_BOOT=1
