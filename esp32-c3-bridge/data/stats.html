<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Message Statistics</title>
    <link rel="stylesheet" href="stats.css">
</head>

<body>
    <div class="card">
        <h2>Messages per Minute</h2>

        <div class="chart-container">
            <div class="chart-area">
                <div id="chart"></div>
                <div class="x-axis">
                    <div>an hour ago</div>
                    <div>now</div>
                </div>
            </div>

            <div class="y-axis">
                <div id="y-max">max</div>
                <div>0</div>
            </div>
        </div>
    </div>

    <script src="stats.js"></script>
</body>

</html>
