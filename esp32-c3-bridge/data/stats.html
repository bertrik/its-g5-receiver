<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Message Statistics</title>
    <link rel="stylesheet" href="stats.css">
</head>

<body>
    <div class="card">
        Now: <span id="timestamp">...</span> (up <span id="uptime">...</span>)<br>
        Latest: <span id="latest">...</span>
    </div>
    <div class="card">
        <h2>Messages per Minute</h2>
        <div class="chart-container">
            <div class="y-axis">
                <div id="y-max">0</div>
                <div>0</div>
            </div>
            <div id="chart"></div>
        </div>
    </div>

    <script src="stats.js"></script>
</body>

</html>
